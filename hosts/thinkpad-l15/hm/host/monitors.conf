# Laptop-first monitor layout for thinkpad-l15 (migrated from Caelestia era).
# Loaded by end-4 via ~/.config/hypr/custom/monitors.conf — plain hyprlang only.
monitor = eDP-1, preferred, auto, 1
workspace=1, monitor:eDP-1, default:true, persistent:true
workspace=2, monitor:eDP-1, persistent:true
workspace=3, monitor:eDP-1, persistent:true
workspace=4, monitor:eDP-1, persistent:true
workspace=5, monitor:eDP-1, persistent:true

# External displays should compose cleanly when attached.
monitor = , preferred, auto, 1
