# Host-specific extra keybinds for mamalona (end-4 custom/ fragment).
# Plain hyprlang. end-4 ships its own defaults — keep only additions here.
# NOTE: Caelestia `caelestia:*` dispatchers / `caelestia toggle ...` commands
# do not exist under end-4 and were intentionally dropped.

# Apps (match repo defaults: kitty / zen-beta / code / dolphin)
bind = SUPER, T, exec, kitty
bind = SUPER, W, exec, zen-beta
bind = SUPER, C, exec, code
bind = SUPER, E, exec, dolphin

# Window basics
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen, 0

# SSH shortcuts (previously Caelestia launcher actions)
bind = SUPER_ALT, H, exec, kitty zsh -lc "ssh juan_ma7u7@thinkpad-l15"
